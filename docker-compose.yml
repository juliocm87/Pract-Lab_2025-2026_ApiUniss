services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ok
      POSTGRES_DB: api_uniss_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_uniss_db"]
      interval: 2s
      timeout: 2s
      retries: 5

  backend:
    build: .
    container_name: node_backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    #environment:
    # - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
